name: Code Quality

on:
  push:
    branches: [master, Features]
  pull_request:
    branches: [master, Features]
  schedule:
    # Run quality checks weekly on Sundays
    - cron: '0 8 * * 0'

env:
  NODE_VERSION: '18'

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage 🧪
        run: npm test -- --coverage --watchAll=false --ci --testResultsProcessor=jest-sonar-reporter
        env:
          CI: true

      - name: SonarCloud Scan 🔍
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Serve application
        run: |
          npm install -g serve
          serve -s build -p 3000 &
          sleep 5
        
      - name: Run Lighthouse 🏮
        uses: treosh/lighthouse-ci-action@v9
        with:
          urls: |
            http://localhost:3000
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and analyze 📊
        run: |
          npm run build
          npx webpack-bundle-analyzer build/static/js/*.js --report --mode static --report-filename bundle-report.html
        continue-on-error: true

      - name: Upload bundle analysis 📤
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: bundle-report.html
          retention-days: 30

  dead-code-detection:
    name: Dead Code Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install dead code detection tools
        run: npm install -g depcheck ts-unused-exports

      - name: Check for unused dependencies 🗑️
        run: |
          echo "Checking for unused dependencies..."
          depcheck --json > depcheck-results.json
          cat depcheck-results.json

      - name: Upload dead code analysis 📤
        uses: actions/upload-artifact@v4
        with:
          name: dead-code-analysis
          path: depcheck-results.json
          retention-days: 30
