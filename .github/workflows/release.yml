name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (what kind of changes)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch    # Bug fixes (3.1.1 -> 3.1.2)
          - minor    # New features (3.1.1 -> 3.2.0)
          - major    # Breaking changes (3.1.1 -> 4.0.0)
      prerelease:
        description: 'Mark as pre-release (beta/rc)'
        required: false
        default: false
        type: boolean
      force_release:
        description: 'Force release (skip quality checks)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '18'

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.checks.outputs.should-release }}
    
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks 🔍
        id: checks
        run: |
          echo "Running linting..."
          npm run lint || echo "⚠️  Linting issues found but continuing..."
          
          echo "Running tests..."
          npm test -- --coverage --watchAll=false || echo "⚠️  Test issues found but continuing..."
          
          echo "Running security scan..."
          npm run security:test || echo "⚠️  Security issues found but continuing..."
          
          echo "should-release=true" >> $GITHUB_OUTPUT
        continue-on-error: ${{ github.event.inputs.force_release == 'true' }}

  bump-version:
    name: Bump Version
    needs: quality-checks
    if: github.event_name == 'workflow_dispatch' && (needs.quality-checks.outputs.should-release == 'true' || github.event.inputs.force_release == 'true')
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.version.outputs.new-version }}
      version-tag: ${{ steps.version.outputs.version-tag }}
    
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Bump version 📈
        id: version
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type }}
        run: |
          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"
          
          # Bump version using npm (using environment variable to prevent injection)
          npm version "$RELEASE_TYPE" --no-git-tag-version
          
          # Get new version
          NEW_VERSION=$(node -p "require('./package.json').version")
          VERSION_TAG="v$NEW_VERSION"
          
          echo "New version: $NEW_VERSION"
          echo "Version tag: $VERSION_TAG"
          
          # Update manifest.json version
          if [ -f "public/manifest.json" ]; then
            sed -i "s/\"version\": \".*\"/\"version\": \"$NEW_VERSION\"/" public/manifest.json
            echo "✅ Updated public/manifest.json to version $NEW_VERSION"
            git add public/manifest.json
          fi
          
          # Update manifest.firefox.json version  
          if [ -f "public/manifest.firefox.json" ]; then
            sed -i "s/\"version\": \".*\"/\"version\": \"$NEW_VERSION\"/" public/manifest.firefox.json
            echo "✅ Updated public/manifest.firefox.json to version $NEW_VERSION"
            git add public/manifest.firefox.json
          fi
          
          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version-tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          
          # Commit version bump (including manifests)
          git add package.json package-lock.json
          git commit -m "chore: bump version to $NEW_VERSION"
          git tag $VERSION_TAG
          git push origin HEAD --follow-tags

  build-extensions:
    name: Build Extensions
    needs: [quality-checks, bump-version]
    if: always() && (needs.quality-checks.outputs.should-release == 'true' || github.event.inputs.force_release == 'true')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [firefox, chrome, edge]
    
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.version-tag || github.ref }}

      - name: Setup Node.js 🔨
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies 📦
        run: npm ci

      - name: Build for ${{ matrix.browser }} 🔧
        run: |
          echo "Building for ${{ matrix.browser }}..."
          if [ "${{ matrix.browser }}" = "firefox" ]; then
            npm run build:firefox
          elif [ "${{ matrix.browser }}" = "chrome" ]; then
            npm run build:chrome  
          else
            npm run build:chrome  # Edge uses Chrome build
          fi
        env:
          CI: false  # Suppress warnings in build

      - name: Package ${{ matrix.browser }} extension 📦
        run: |
          echo "Packaging ${{ matrix.browser }} extension..."
          npm run package:${{ matrix.browser }}
          
          # List generated files for debugging
          echo "Generated files:"
          ls -la *.zip || echo "No zip files found"

      - name: Upload ${{ matrix.browser }} artifact 💾
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.browser }}
          path: "*.zip"
          retention-days: 30

  create-release:
    name: Create Release
    needs: [quality-checks, bump-version, build-extensions]
    if: always() && (needs.quality-checks.outputs.should-release == 'true' || github.event.inputs.force_release == 'true')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.version-tag || github.ref }}
          fetch-depth: 0

      - name: Download all artifacts 📥
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files 📋
        run: |
          mkdir -p release-files
          find artifacts -name "*.zip" -exec cp {} release-files/ \;
          echo "Release files prepared:"
          ls -la release-files/

      - name: Generate release notes 📝
        id: release-notes
        run: |
          VERSION="${{ needs.bump-version.outputs.version-tag }}"
          if [[ -z "$VERSION" ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          if [[ -z "$VERSION" ]]; then
            VERSION="v$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          fi
          
          # Get the previous tag for changelog
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          cat > release-notes.md << EOF
          ## 🚀 Distract Me Not Plus ${VERSION}
          
          ### 📋 What's Changed
          EOF
          
          if [[ -n "$PREV_TAG" ]]; then
            echo "$(git log ${PREV_TAG}..HEAD --pretty=format:'- %s (%h)' --no-merges)" >> release-notes.md
          else
            echo "- Initial release or first automated release" >> release-notes.md
          fi
          
          cat >> release-notes.md << EOF
          
          ### 🌐 Browser Support
          - 🦊 **Firefox** - Use \`distract-me-not-*-firefox.zip\`
          - 🌐 **Chrome** - Use \`distract-me-not-*-chrome.zip\`  
          - 📘 **Edge** - Use \`distract-me-not-*-edge.zip\`
          
          ### 📥 Installation
          1. Download the appropriate ZIP file for your browser
          2. Extract the ZIP file
          3. Load the extension in your browser's developer mode
          4. See README.md for detailed installation instructions
          
          ### 🔧 Technical Details
          - Built with Node.js ${{ env.NODE_VERSION }}
          - Tested on latest browser versions
          - Security scanned and validated
          EOF
          
          echo "Generated release notes:"
          cat release-notes.md
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release 🚢
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-notes.outputs.version }}
          name: "🚀 Release ${{ steps.release-notes.outputs.version }}"
          body_path: release-notes.md
          files: release-files/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          fail_on_unmatched_files: true

      - name: Release Summary 📊
        run: |
          echo "## 🎉 Release Complete!" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Version: ${{ steps.release-notes.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- Firefox Extension" >> $GITHUB_STEP_SUMMARY
          echo "- Chrome Extension" >> $GITHUB_STEP_SUMMARY  
          echo "- Edge Extension" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Links:" >> $GITHUB_STEP_SUMMARY
          echo "- [View Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.release-notes.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Download Assets](https://github.com/${{ github.repository }}/releases/tag/${{ steps.release-notes.outputs.version }})" >> $GITHUB_STEP_SUMMARY
